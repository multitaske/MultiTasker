<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নিউজ ফটো কার্ড জেনারেটর</title>
  <!-- Google Fonts for Bangla -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --accent-color: #e11d48;
      --text-color: #f8fafc;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--panel-bg);
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      color: #f43f5e;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .editor-panel {
      flex: 1;
      min-width: 320px;
      background: var(--panel-bg);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      max-height: 85vh;
      overflow-y: auto;
    }

    .preview-panel {
      flex: 1;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input[type="file"] {
      width: 100%;
      padding: 0.4rem;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #94a3b8;
    }

    .range-group {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .range-group input[type="range"] {
      flex: 1;
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #be123c;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      background: #000;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>অটো নিউজ ফটো কার্ড মেকার</h1>
  </header>

  <div class="container">
    <!-- Controls Panel -->
    <div class="editor-panel">
      <div class="form-group">
        <label for="dateText">তারিখ ও শিরোনাম তথ্য</label>
        <input type="text" id="dateText" value="০৩ | নভেম্বর | ২০২৬">
      </div>

      <div class="form-group">
        <label for="portalText">পোর্টাল নাম (লোগো টেক্সট)</label>
        <input type="text" id="portalText" value="ডেইলি কুড়িগ্রাম">
      </div>

      <div class="form-group">
        <label for="headlineText">প্রধান শিরোনাম (উপরের লেখা)</label>
        <textarea id="headlineText">কুড়িগ্রামে বিএনপি ও ছাত্রদলের অভিযোগের কারনে জেলা মডেল মসজিদে প্রোগ্রাম করতে দিচ্ছে না আওয়ামী দোসর ডিসি।</textarea>
      </div>

      <div class="form-group">
        <label for="quoteText">মূল বক্তব্য (উক্তি)</label>
        <textarea id="quoteText">শিবিরকে দমাতে আসলে আরো ৭ বার জন্ম গ্রহণ করতে হবে। আমাদের প্রোগ্রাম এখন সঠিক সময়ে জেলা জামায়াতের অফিসে হবে। ইনশাআল্লাহ</textarea>
      </div>

      <div class="form-group">
        <label for="nameText">বক্তার নাম</label>
        <input type="text" id="nameText" value="মোঃ মোশারফ হোসেন">
      </div>

      <div class="form-group">
        <label for="designationText">পদবী / পরিচয়</label>
        <input type="text" id="designationText" value="সভাপতি, বাংলাদেশ ইসলামী ছাত্রশিবির কুড়িগ্রাম জেলা">
      </div>

      <hr style="border-color: var(--border-color); margin: 1.5rem 0;">

      <div class="form-group">
        <label for="personImg">ব্যক্তির ছবি আপলোড</label>
        <input type="file" id="personImg" accept="image/*">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>ছবি জুম (Zoom)</label>
          <input type="range" id="imgScale" min="0.5" max="2" step="0.05" value="1">
        </div>
        <div class="form-group">
          <label>ছবি ডান/বাম (X Position)</label>
          <input type="range" id="imgX" min="-300" max="300" value="0">
        </div>
      </div>

      <div class="form-group">
        <label>ছবি উপর/নিচ (Y Position)</label>
        <input type="range" id="imgY" min="-300" max="300" value="0">
      </div>

      <hr style="border-color: var(--border-color); margin: 1.5rem 0;">

      <div class="grid-2">
        <div class="form-group">
          <label for="themeColor">ব্যাকগ্রাউন্ড থিম</label>
          <select id="themeColor">
            <option value="red">ডার্ক রেড (Dark Red)</option>
            <option value="blue">ডার্ক ব্লু (Dark Blue)</option>
            <option value="green">ডার্ক গ্রিন (Dark Green)</option>
            <option value="dark">ডার্ক স্লেট (Dark Slate)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="fontSelect">বাংলা ফন্ট</label>
          <select id="fontSelect">
            <option value="'Hind Siliguri', sans-serif">Hind Siliguri</option>
            <option value="'Anek Bangla', sans-serif">Anek Bangla</option>
            <option value="'Noto Sans Bengali', sans-serif">Noto Sans Bengali</option>
            <option value="'Tiro Bangla', serif">Tiro Bangla</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Preview & Download Panel -->
    <div class="preview-panel">
      <canvas id="cardCanvas" width="800" height="800"></canvas>
      <button class="btn" id="downloadBtn">ফটো কার্ড ডাউনলোড করুন (PNG)</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');

    // Form inputs
    const dateText = document.getElementById('dateText');
    const portalText = document.getElementById('portalText');
    const headlineText = document.getElementById('headlineText');
    const quoteText = document.getElementById('quoteText');
    const nameText = document.getElementById('nameText');
    const designationText = document.getElementById('designationText');
    const personImgInput = document.getElementById('personImg');
    const imgScale = document.getElementById('imgScale');
    const imgX = document.getElementById('imgX');
    const imgY = document.getElementById('imgY');
    const themeColor = document.getElementById('themeColor');
    const fontSelect = document.getElementById('fontSelect');
    const downloadBtn = document.getElementById('downloadBtn');

    let personImage = null;

    // Background Gradients
    const themes = {
      red: ['#580507', '#2b0002', '#140001'],
      blue: ['#0f172a', '#1e3a8a', '#020617'],
      green: ['#064e3b', '#022c22', '#011710'],
      dark: ['#1e293b', '#0f172a', '#020617']
    };

    function drawCard() {
      // Clear Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const selectedFont = fontSelect.value;
      const theme = themes[themeColor.value];

      // 1. Draw Background Gradient
      const grad = ctx.createRadialGradient(200, 300, 50, 400, 400, 600);
      grad.addColorStop(0, theme[0]);
      grad.addColorStop(0.6, theme[1]);
      grad.addColorStop(1, theme[2]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Draw Person Image (Right Side)
      if (personImage) {
        ctx.save();
        const baseWidth = 450;
        const scale = parseFloat(imgScale.value);
        const w = baseWidth * scale;
        const h = (personImage.height / personImage.width) * w;
        
        const posX = 420 + parseFloat(imgX.value);
        const posY = 800 - h + parseFloat(imgY.value);

        ctx.drawImage(personImage, posX, posY, w, h);
        ctx.restore();
      }

      // 3. Top Header Section (Date & Logo)
      ctx.font = `600 22px ${selectedFont}`;
      ctx.fillStyle = '#e2e8f0';
      ctx.fillText(dateText.value, 250, 60);

      // Quote Symbol Left
      ctx.font = `700 90px ${selectedFont}`;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.fillText('“', 60, 110);

      // Logo/Portal Badge Top Right
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(550, 35, 200, 45);
      ctx.font = `700 22px ${selectedFont}`;
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(portalText.value, 650, 65);
      ctx.textAlign = 'left';

      // 4. Headline Text
      ctx.font = `700 28px ${selectedFont}`;
      ctx.fillStyle = '#ffffff';
      wrapText(ctx, headlineText.value, 50, 160, 520, 38);

      // 5. Main Quote Text (Yellow/White Accent)
      ctx.font = `700 26px ${selectedFont}`;
      ctx.fillStyle = '#fef08a'; // Light Yellow Color
      wrapText(ctx, quoteText.value, 50, 390, 480, 36);

      // 6. Footer Divider Line
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(50, 700);
      ctx.lineTo(420, 700);
      ctx.stroke();

      // 7. Speaker Name & Designation
      ctx.font = `700 34px ${selectedFont}`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(nameText.value, 50, 745);

      ctx.font = `400 18px ${selectedFont}`;
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(designationText.value, 50, 775);
    }

    // Canvas Text Wrapping Helper Function
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        const testWidth = metrics.width;
        
        if (testWidth > maxWidth && n > 0) {
          context.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line, x, y);
    }

    // Image Upload Event
    personImgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          personImage = new Image();
          personImage.onload = () => drawCard();
          personImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Listeners for inputs
    const inputs = [dateText, portalText, headlineText, quoteText, nameText, designationText, imgScale, imgX, imgY, themeColor, fontSelect];
    inputs.forEach(input => input.addEventListener('input', drawCard));

    // Download PNG
    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'news-photo-card.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Initial Render after fonts load
    document.fonts.ready.then(() => {
      drawCard();
    });
  </script>
</body>
</html>
